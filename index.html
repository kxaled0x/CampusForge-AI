/* ---------------- graph layout and rendering ---------------- */
const NW = 178, NH = 48, CG = 66, RG = 14;
const TYPE_CLS = { FUNCTION: 'fn', COMPONENT: 'cp', RESOURCE: 'rs', CONSTRAINT: 'k' };

  if (n.type === 'RESOURCE') return st.state === 'OPERATIONAL' ? 'ok' : st.state === 'UNAVAILABLE' ? 'off' : (st.res === 'RESOLVABLE' ? 'risk' : 'gap');

}
const GLYPH = { ok: 'M-4 0.4l2.7 2.7 5.3-5.8', risk: 'M3.4-2.6A4.3 4.3 0 1 0 4.2 1.4M3.9-5.2v2.8H1.1', partial: 'M0-4.6a4.6 4.6 0 0 1 0 9.2z', gap: 'M0-4.6v5.2M0 3.7v.5', off: 'M-3.4-3.4l6.8 6.8M3.4-3.4l-6.8 6.8' };
const PAL = { fn: '#0A8FB4', cp: '#6B4BDB', rs: '#2F63D8', k: '#66789F', ok: '#0F9466', risk: '#B7740A', partial: '#B7740A', gap: '#D0244F', off: '#D2620A', text: '#0B1533', muted: '#51618A', line: '#9AA8C6' };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const trunc = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

function computeLayout(g, rtl, opt) {
  opt = opt || {};

  const cols = [[], [], []];
  const colOf = id => { const ty = g.nodes.get(id).type; return ty === 'FUNCTION' ? 0 : ty === 'COMPONENT' ? 1 : ty === 'RESOURCE' ? 2 : -1; };
  for (const id of g.nodes.keys()) { const c = colOf(id); if (c >= 0) cols[c].push(id); }
  const nb = new Map();
  for (const id of g.nodes.keys()) nb.set(id, []);
  for (const e of g.edges) if (e.type !== 'BOUNDS' && e.from !== e.to) { nb.get(e.from).push(e.to); nb.get(e.to).push(e.from); }
  const idx = new Map();
  cols.forEach(c => c.forEach((id, i) => idx.set(id, i)));
  const cpos = id => idx.get(id) - (cols[colOf(id)].length - 1) / 2;
  const sortCol = (ci, use) => {
    const c = cols[ci], bc = new Map();
    c.forEach(id => { const ns = nb.get(id).filter(x => use.indexOf(colOf(x)) >= 0); bc.set(id, ns.length ? ns.reduce((s2, x) => s2 + cpos(x), 0) / ns.length : cpos(id)); });
    c.sort((x, y) => bc.get(x) - bc.get(y) || idx.get(x) - idx.get(y));
    c.forEach((id, i) => idx.set(id, i));
  };
  for (let it = 0; it < 4; it++) { sortCol(1, [0, 2]); sortCol(2, [1, 2]); sortCol(0, [1]); }

    c.forEach((id, i) => pos.set(id, { x: colX(ci), y: off + i * H }));
    if (ci === 0) ks.forEach((id, j) => pos.set(id, { x: colX(0), y: off + (c.length + 0.6 + j) * H }));

function edgePath(a, b, Lay) {
  const y1 = a.y + NH / 2, y2 = b.y + NH / 2;
  if (Math.abs(a.x - b.x) < 4) {
    const bulge = 24 + Math.min(60, Math.abs(y2 - y1) * 0.2);

function nodeSub(p, n, st) {

const Hero = { timers: [] };

function heroPlay() {
  heroStop();
  const box = $('#hero-graph'), cap = $('#hero-cap');
  if (!box || !cap) return;
  const p = heroProject();
  const tgt = p.current.config.assign.mcu;
  const ctx = E.createContext(S.ws.catalog, { overrides: { [tgt]: 'AVAILABLE' } });
  const g = E.buildGraph(p, p.current.config, ctx);
  const A = E.analyze(g, ctx);
  const draw = (gr, states, extra) => { box.innerHTML = graphSVG(p, gr, states, Object.assign({ layout: computeLayout(gr, S.lang === 'ar', { gap: 70, pad: 60, noK: true }), idp: 'h' }, extra || {})); };
  const before = new Map(A.states);
  draw(g, before);
  cap.innerHTML = t('hero_cap0');
  ctx.setStatus(tgt, 'UNAVAILABLE');
  const res = E.propagate(g, A, [{ res: tgt, from: 'AVAILABLE', to: 'UNAVAILABLE' }], ctx);
  const rc = E.reconfigure(p, p.current.config, ctx, { mode: 'adaptive', analysis: A, weights: S.ws.weights });
  const top = rc.valid[0];
  const later = (ms, f) => Hero.timers.push(setTimeout(f, ms));
  const finalDraw = () => {
    if (!top) { draw(g, A.states, { hl: { seeds: new Set(res.seeds), changed: new Set(res.changed), examined: new Set() } }); cap.innerHTML = t('hero_cap_none'); return; }
    const g2 = E.buildGraph(p, top.config, ctx), A2 = E.analyze(g2, ctx);
    const fresh = new Set();
    for (const id of g2.nodes.keys()) if (!g.nodes.has(id)) fresh.add(id);
    for (const c of top.metrics.changes) fresh.add('C:' + c.comp);
    draw(g2, A2.states, { hl: { seeds: new Set(), changed: fresh, examined: new Set() } });
    cap.innerHTML = t('hero_cap_done', { n: num(rc.validCount, 0), res: B(resLabel(top.config.assign.mcu)), ev: num(res.evaluated, 0), total: num(res.total, 0), ms: num(rc.ms, 0) });
  };
  if (reduceMotion()) { finalDraw(); return; }
  const display = new Map(before), shown = new Set();
  const steps = res.audit.filter(a => a.kind === 'change');
  later(1000, () => { cap.innerHTML = t('hero_cap1', { res: B(resLabel(tgt)) }); });
  steps.forEach((a, i) => later(1500 + i * 430, () => {
    display.set(a.node, A.states.get(a.node)); shown.add(a.node);
    draw(g, display, { hl: { seeds: new Set(res.seeds), changed: shown, examined: new Set() }, pulse: a.node });
  }));
  const tEnd = 1500 + steps.length * 430;
  later(tEnd + 150, () => { cap.innerHTML = t('hero_cap2', { ev: num(res.evaluated, 0), total: num(res.total, 0) }); });
  later(tEnd + 2600, finalDraw);
}

const CAP_STAGE = { wireless_uplink: 3, message_broker: 3, timeseries_db: 3, server_host: 3, dashboard_ui: 4, alert_notifications: 4, ml_inference_vehicle: 4, anomaly_detection: 4, actuator_valve: 4, relay_drive: 4, local_display: 4 };
function buildPlan(p) {
  const r = rt(p), v = statusOf(p).v, g = r.graph, lines = v.metrics.lines;
  const maxLead = v.metrics.maxLead;
  const proc = lines.filter(l => l.lead > 0).sort((a, b) => b.lead - a.lead);
  const used = new Set(), tasks = [];
  let tc = maxLead;
  const auxL = lines.filter(l => l.aux);
  if (auxL.length) { const d = auxL.reduce((s, l) => s + l.effort, 0); auxL.forEach(l => used.add(l.rid)); tasks.push({ kind: 'infra', start: tc, dur: d, rids: auxL.map(l => l.rid), stage: 1 }); tc += d; }
  const fns = p.functions.slice().sort((a, b) => g.rank.get('F:' + a.id) - g.rank.get('F:' + b.id));
  for (const f of fns) {
    const rids = []; let d = 0;
    for (const cid of f.requires || []) { const rid = p.current.config.assign[cid]; if (rid && !used.has(rid)) { used.add(rid); rids.push(rid); const l = lines.find(x => x.rid === rid); d += l ? l.effort : 0; } }
    const stage = Math.max(2, ...(f.requires || []).map(cid => CAP_STAGE[(compOf(p, cid) || {}).capability] || 2));
    tasks.push({ kind: 'fn', fn: f.id, start: tc, dur: d, rids, stage });
    tc += d;
  }
  const ms = [{ k: 'm1', day: maxLead }];
  let prev = maxLead;
  for (const s of [2, 3, 4]) { const ends = tasks.filter(x => x.stage === s).map(x => x.start + x.dur); prev = ends.length ? Math.max(prev, ...ends) : prev; ms.push({ k: 'm' + s, day: prev }); }
  return { proc, tasks, total: tc, maxLead, deadline: p.deadlineDays, lines, ms, v };
}

const splitTags = s => uniqA(String(s || '').split(/[,\s،]+/).map(x => x.trim()).filter(Boolean));
function qualityChecks() {
  const out = [], cat = S.ws.catalog, provided = new Set();
  cat.forEach(r => Object.keys(r.provides || {}).forEach(x => provided.add(x)));
  const names = {};
  for (const r of cat) {
    if (!Object.keys(r.provides || {}).length) out.push({ sev: 'error', k: 'dq_no_provides', p: { res: resLabel(r.id) } });
    const reqs = (r.requires || []).concat(...Object.values(r.provides || {}));
    for (const x of uniqA(reqs)) if (!provided.has(x)) out.push({ sev: 'error', k: 'dq_dangling', p: { res: resLabel(r.id), tag: esc(tagLabel(x)) } });
    for (const x of uniqA(Object.keys(r.provides || {}).concat(r.requires || []))) if (!D.TAGS[x]) out.push({ sev: 'warn', k: 'dq_unknown_tag', p: { res: resLabel(r.id), tag: esc(x) } });
    if (!r.desc || !r.desc.en || !r.desc.ar) out.push({ sev: 'warn', k: 'dq_lang', p: { res: resLabel(r.id) } });
    if ((r.confidence || 0) < 0.6) out.push({ sev: 'info', k: 'dq_conf', p: { res: resLabel(r.id), c: pct(r.confidence || 0) } });
    const nk = String(r.name).toLowerCase(); names[nk] = (names[nk] || 0) + 1;
  }
  for (const n of Object.keys(names)) if (names[n] > 1) out.push({ sev: 'warn', k: 'dq_dup', p: { name: esc(n) } });
  for (const p of projectList()) {
    for (const c of p.components) if (!cat.some(r => r.provides && Object.prototype.hasOwnProperty.call(r.provides, c.capability) && r.status === 'AVAILABLE')) out.push({ sev: 'error', k: 'dq_no_provider', p: { p: esc(tx(p.title)), comp: esc(compLabel(p, c.id)) } });
    if (rt(p).graph.cycles.length) out.push({ sev: 'info', k: 'dq_cycle', p: { p: esc(tx(p.title)), n: rt(p).graph.cycles.length } });
  }
  return out;
}

function readResForm(old) {

  const err = m => { const e = $('#form-err'); if (e) e.textContent = m; return null; };

  if (!/^[A-Za-z0-9_.-]{2,40}$/.test(id)) return err(t('fe_id'));
  if (!old && S.byId.has(id)) return err(t('fe_dup'));
  if (!name) return err(t('fe_name'));
  const provs = splitTags(q('provides').value);
  if (!provs.length) return err(t('fe_provides'));
  const nums = ['cost', 'leadDays', 'effortDays', 'confidence'].map(k => parseFloat(q(k).value));
  if (nums.some(x => isNaN(x) || x < 0) || nums[3] > 1) return err(t('fe_nums'));
  const provides = {};
  for (const x of provs) provides[x] = (old && old.provides && old.provides[x]) || [];
  return Object.assign({}, old || { synthetic: true }, { id, name, category: q('category').value, status: q('status').value, provides, requires: splitTags(q('requires').value), cost: nums[0], leadDays: nums[1], effortDays: nums[2], confidence: nums[3], desc: { en: q('desc_en').value.trim(), ar: q('desc_ar').value.trim() }, verified: q('verified').checked });
}

  'cat-add'() { const n = S.ws.categories.length + 1; S.ws.categories.push({ id: 'cat-' + Date.now().toString(36), en: 'New category ' + n, ar: 'فئة جديدة ' + n }); Store.save('categories', { items: S.ws.categories }); render(); },
  'cat-del'(el) { S.ws.categories.splice(+el.dataset.i, 1); Store.save('categories', { items: S.ws.categories }); render(); },
  'pj-dup'(el) {
    const src = S.ws.projects[el.dataset.id]; if (!src) return;
    const p = clone(src); p.id = 'u' + Date.now().toString(36); p.sample = false; p.createdAt = Date.now();
    p.title = { en: src.title.en + ' (copy)', ar: src.title.ar + ' (نسخة)' }; p.history = [{ ts: p.createdAt, kind: 'create' }];
    S.ws.projects[p.id] = p; saveProject(p); toast(t('saved'), 'ok'); render();
  },
  'pj-del'(el) {
    const p = S.ws.projects[el.dataset.id]; if (!p) return;
    if (projectList().length <= 1) { toast(t('pj_last'), 'warn'); return; }
    delete S.ws.projects[p.id]; delete S.rt[p.id];
    if (p.sample) S.ws.deleted.push(p.id);
    Store.save('p_' + p.id, null);
    if (S.ws.activeId === p.id) S.ws.activeId = projectList()[0].id;
    savePrefs(); toast(t('deleted'), 'ok'); render();
  },
  'pj-restore'() { S.ws.deleted = []; for (const d of D.PROJECTS) { S.ws.projects[d.id] = initSample(d); delete S.rt[d.id]; saveProject(S.ws.projects[d.id]); } savePrefs(); toast(t('restored'), 'ok'); render(); },
  'usr-add'() { S.ws.users.push({ id: 'u' + Date.now().toString(36), name: { en: 'Demo user', ar: 'مستخدم تجريبي' }, role: 'student', status: 'active' }); Store.save('users', { items: S.ws.users }); render(); },
  'usr-del'(el) { S.ws.users.splice(+el.dataset.i, 1); Store.save('users', { items: S.ws.users }); render(); }
});
Object.assign(IN, {
  'adm-q'(el) { S.ui.admin.q = el.value; const b = $('#adm-res'); const q = el.value.toLowerCase(); if (b) b.innerHTML = adminResTable(S.ws.catalog.filter(r => (!S.ui.admin.cat || r.category === S.ui.admin.cat) && (!q || (r.id + ' ' + r.name).toLowerCase().indexOf(q) >= 0))); },
  'cat-name'(el) { S.ws.categories[+el.dataset.i][el.dataset.l] = el.value; Store.save('categories', { items: S.ws.categories }); },
  'pj-title'(el) { const p = S.ws.projects[el.dataset.id]; if (p) { p.title[el.dataset.l] = el.value; saveProject(p); } },
  'usr-name'(el) { S.ws.users[+el.dataset.i].name[el.dataset.l] = el.value; Store.save('users', { items: S.ws.users }); }
});
Object.assign(ON, {
  'adm-cat'(el) { S.ui.admin.cat = el.value; render(); },
  'res-status'(el) { const r = S.byId.get(el.dataset.res); if (r) { r.status = el.value; catalogEdited(); toast(t('saved'), 'ok'); } },
  'pj-num'(el) { const p = S.ws.projects[el.dataset.id], v = parseFloat(el.value); if (p && v > 0) { p[el.dataset.k] = v; p.history.push({ ts: Date.now(), kind: 'edit' }); delete S.rt[p.id]; saveProject(p); } },
  'usr-role'(el) { S.ws.users[+el.dataset.i].role = el.value; Store.save('users', { items: S.ws.users }); },
  'usr-status'(el) { S.ws.users[+el.dataset.i].status = el.value; Store.save('users', { items: S.ws.users }); }
});

/* ---------------- registry and boot ---------------- */
Object.assign(PAGES, { dashboard: pageDashboard, new: pageNew, gaps: pageGaps, reconfig: pageReconfig, planner: pagePlanner, report: pageReport, lab: pageLab, engine: pageEngine, admin: pageAdmin });
function boot() {
  loadPrefLocal();
  S.ws = defaultWorkspace();
  catalogChanged();
  ensureSamples();
  const st = document.createElement('style'); st.id = 'report-css'; st.textContent = REPORT_CSS; document.head.appendChild(st);
  applyTheme();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system' && S.route !== 'new') render(); }); } catch (e) { /* older browsers */ }
  window.addEventListener('hashchange', onRoute);
  onRoute();
  Store.init();
  getCap('downloads').then(() => { if (S.route === 'report') render(); });
  getCap('sample').then(() => { const s = $('#llm-slot'); if (s) s.innerHTML = llmButton(); });
}
window.CF_APP = { S, t, runEvent, applyConfig, searchAlternatives, rt, activeP, render, triggerEvent, finishAnim };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
