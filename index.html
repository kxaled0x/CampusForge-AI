<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusForge AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>:root{
  --bg:#F2F5FB;--bg2:#E7ECF6;--panel:#FFFFFF;--panel2:#F5F7FC;--line:#DAE1EE;--line2:#C3CEE3;
  --text:#0B1533;--muted:#4E5E86;--faint:#8291B5;
  --cyan:#0A86A8;--cyan-bg:rgba(10,134,168,.10);--on-cyan:#FFFFFF;
  --purple:#6A4AD8;--purple-bg:rgba(106,74,216,.10);
  --blue:#2F63D8;--blue-bg:rgba(47,99,216,.09);
  --slate:#63759C;--slate-bg:rgba(99,117,156,.10);
  --ok:#0E8A5F;--ok-bg:rgba(14,138,95,.10);
  --risk:#A86B06;--risk-bg:rgba(214,150,24,.14);
  --gap:#C81E4B;--gap-bg:rgba(200,30,75,.09);
  --off:#C65A08;--off-bg:rgba(198,90,8,.11);
  --grid:rgba(11,21,51,.08);
  --shadow:0 1px 2px rgba(11,21,51,.05),0 8px 24px rgba(11,21,51,.07);
  --font-d:"Readex Pro","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-t:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050A1C;--bg2:#081029;--panel:#0B1431;--panel2:#0E1938;--line:#1A2752;--line2:#26376B;
  --text:#E5ECFF;--muted:#98A7D0;--faint:#6676A3;
  --cyan:#33E1FF;--cyan-bg:rgba(51,225,255,.11);--on-cyan:#03131B;
  --purple:#A88EFF;--purple-bg:rgba(168,142,255,.13);
  --blue:#6E9BFF;--blue-bg:rgba(110,155,255,.12);
  --slate:#8FA0C8;--slate-bg:rgba(143,160,200,.11);
  --ok:#3DDC97;--ok-bg:rgba(61,220,151,.11);
  --risk:#FFC34D;--risk-bg:rgba(255,195,77,.13);
  --gap:#FF5C86;--gap-bg:rgba(255,92,134,.13);
  --off:#FF9548;--off-bg:rgba(255,149,72,.14);
  --grid:rgba(152,167,208,.13);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"],.dark-scope{
  --bg:#050A1C;--bg2:#081029;--panel:#0B1431;--panel2:#0E1938;--line:#1A2752;--line2:#26376B;
  --text:#E5ECFF;--muted:#98A7D0;--faint:#6676A3;
  --cyan:#33E1FF;--cyan-bg:rgba(51,225,255,.11);--on-cyan:#03131B;
  --purple:#A88EFF;--purple-bg:rgba(168,142,255,.13);
  --blue:#6E9BFF;--blue-bg:rgba(110,155,255,.12);
  --slate:#8FA0C8;--slate-bg:rgba(143,160,200,.11);
  --ok:#3DDC97;--ok-bg:rgba(61,220,151,.11);
  --risk:#FFC34D;--risk-bg:rgba(255,195,77,.13);
  --gap:#FF5C86;--gap-bg:rgba(255,92,134,.13);
  --off:#FF9548;--off-bg:rgba(255,149,72,.14);
  --grid:rgba(152,167,208,.13);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 var(--font-t)}
html[lang="ar"] body{line-height:1.75;font-size:15.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.25;margin:0 0 .5em;color:var(--text)}
h1{font-size:clamp(24px,3vw,31px)}h2{font-size:18px}h3{font-size:15.5px}h4{font-size:13.5px;color:var(--muted);margin-top:14px}
html[lang="en"] h1{letter-spacing:-.015em}
p{margin:0 0 .8em}
a{color:var(--cyan)}
img,svg{max-width:100%}
code{font-family:var(--font-m);font-size:12.5px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.d-block{display:block}.small{font-size:13px}.muted{color:var(--muted)}.grow{flex:1}
.hint{color:var(--muted);font-size:13.5px}
.note{color:var(--muted);font-size:12.5px;margin-top:10px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:28px;height:28px;flex:none}.lg-l{fill:none;stroke:var(--line2);stroke-width:1.6}.lg-a{fill:var(--cyan)}.lg-b{fill:var(--purple)}.lg-c{fill:var(--blue)}

/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid transparent;font:600 14px/1.2 var(--font-t);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn.primary{background:var(--cyan);color:var(--on-cyan)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.danger{background:var(--gap);color:#fff}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.lg{padding:12px 22px;font-size:15.5px}
.btn:disabled,.icon-btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;flex:none;padding:0}
.icon-btn:hover{border-color:var(--cyan)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:7px 12px;background:transparent;border:0;color:var(--muted);font:600 13px/1.2 var(--font-t);cursor:pointer}
.seg.small button{padding:6px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--cyan-bg);color:var(--text)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 10px 0;overflow-x:auto}
.tabs button{padding:8px 12px;border:0;background:none;color:var(--muted);font:600 13.5px var(--font-t);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--cyan)}
.tabs.big{margin-bottom:12px;padding-inline:0}
input,select,textarea{font:400 14.5px/1.4 var(--font-t);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;min-width:0;max-width:100%}
textarea{resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
input[type="checkbox"],input[type="range"]{accent-color:var(--cyan)}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.tog input{width:16px;height:16px}
.search{width:min(100%,360px)}
.switch{width:40px;height:22px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);position:relative;flex:none;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--cyan-bg);border-color:var(--cyan)}
.switch[aria-checked="true"] span{background:var(--cyan);transform:translateX(18px)}
[dir="rtl"] .switch[aria-checked="true"] span{transform:translateX(-18px)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.7;border:1px solid var(--line2);color:var(--muted);background:var(--panel2);white-space:nowrap;vertical-align:middle}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.chip.risk,.chip.partial{color:var(--risk);border-color:var(--risk);background:var(--risk-bg)}
.chip.gap{color:var(--gap);border-color:var(--gap);background:var(--gap-bg)}
.chip.off{color:var(--off);border-color:var(--off);background:var(--off-bg)}
.chip.cyan{color:var(--text);border-color:var(--cyan);background:var(--cyan-bg)}
.chip.info{color:var(--muted)}
.chip-x{all:unset;cursor:pointer;padding:0 3px;font-weight:700;color:var(--muted)}
.chip-x:focus-visible{outline:2px solid var(--cyan)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.page-head .row-btns{margin-top:0}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:9px;font:600 16px var(--font-d);color:var(--text);text-decoration:none;white-space:nowrap}
.proj-sel select{max-width:280px;font-weight:600;padding:7px 10px}
.role-sel select{padding:7px 8px;font-size:13px}
.menu-btn{display:none}
.store-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.store-chip i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st-cloud i{background:var(--ok)}.st-loading i{background:var(--cyan)}.st-slow i,.st-readonly i{background:var(--risk)}
.rail{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow:auto;padding:14px 10px;border-inline-end:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.rail a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.rail a:hover{color:var(--text);background:var(--bg2)}
.rail a.on{background:var(--cyan-bg);color:var(--text)}
.rail a.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan)}
.rail-foot{margin-top:auto;padding:12px;font-size:12px;color:var(--faint)}
.scrim{display:none}
.main{padding:24px clamp(14px,3vw,34px) 64px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lede{color:var(--muted);max-width:72ch;margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;min-width:0}
.panel>h2{margin-bottom:12px}
.empty{text-align:center;padding:48px 16px;max-width:600px;margin:0 auto}
.empty.small{padding:22px 16px}
.warnbox{background:var(--risk-bg);border:1px solid var(--risk);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.gapbox{background:var(--gap-bg);border:1px solid var(--gap);border-radius:12px;margin-bottom:14px}
.form-err{color:var(--gap);font-size:13.5px;min-height:1em;margin:8px 0 0}

/* data display */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi-v{font:600 23px/1.3 var(--font-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-s{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.ok .kpi-v{color:var(--ok)}.kpi.gap .kpi-v{color:var(--gap)}.kpi.risk .kpi-v{color:var(--risk)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.span2{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl.compact td,.tbl.compact th{padding:6px 8px;font-size:13px}
.tbl tr.cur td{background:var(--cyan-bg)}
.tbl tr.diff td{background:var(--risk-bg)}
.tbl tr.sub td{font-weight:600;color:var(--muted);background:var(--panel2);font-size:12.5px}
.tbl td.act{white-space:nowrap;text-align:end}
.tbl td.act .btn+.icon-btn{margin-inline-start:6px}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;width:96px;margin:6px 0 2px}
.bar span{display:block;height:100%;background:var(--cyan)}
.fn-sum{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.fn-sum.big .fs b{font-size:24px}
.fs{flex:1 1 92px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel2)}
.fs b{display:block;font:600 20px var(--font-d)}
.fs span{font-size:12px;color:var(--muted)}
.fs-full b{color:var(--ok)}.fs-atRisk b,.fs-partial b{color:var(--risk)}.fs-blocked b,.fs-uncovered b{color:var(--gap)}
.dq-error b{color:var(--gap)}.dq-warn b{color:var(--risk)}.dq-info b{color:var(--slate)}
ul.mini{list-style:none;padding:0;margin:4px 0 10px}
ul.mini li{padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
ul.mini li.ok{color:var(--ok)}ul.mini li.gap{color:var(--gap)}
.activity{list-style:none;padding:0;margin:0}
.activity li{display:grid;grid-template-columns:12px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.activity .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--slate)}
.act-event .dot{background:var(--off)}.act-apply .dot{background:var(--ok)}.act-create .dot{background:var(--cyan)}
.metric span{display:block;font-size:11.5px;color:var(--muted)}
.metric b{font:600 14.5px var(--font-d)}
pre.code{font-family:var(--font-m);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:340px;direction:ltr;text-align:left}
details>summary{cursor:pointer;font-weight:600}
details.json{margin-top:12px}

/* graph page */
.gtool{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.gmain{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.gcanvas{position:relative;height:min(70vh,720px);min-height:420px;background-color:var(--panel2);background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:22px 22px;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:grab;touch-action:none}
.gcanvas:active{cursor:grabbing}
.gsvg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.gside{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:min(70vh,720px);min-height:420px;min-width:0}
.side-body{overflow:auto;padding:12px 14px 16px;flex:1}
.n{cursor:pointer}
.n .shape{fill:var(--panel);stroke:var(--slate);stroke-width:1.6;transition:fill .25s,stroke .25s}
.n.t-fn .shape{stroke:var(--cyan);fill:color-mix(in srgb,var(--cyan) 8%,var(--panel))}
.n.t-cp .shape{stroke:var(--purple);fill:color-mix(in srgb,var(--purple) 8%,var(--panel))}
.n.t-rs .shape{stroke:var(--blue);fill:color-mix(in srgb,var(--blue) 7%,var(--panel))}
.n.t-k .shape{stroke:var(--slate);fill:color-mix(in srgb,var(--slate) 8%,var(--panel))}
.n.tone-risk .shape{stroke:var(--risk);stroke-dasharray:6 4;fill:color-mix(in srgb,var(--risk) 12%,var(--panel))}
.n.tone-partial .shape{stroke:var(--risk);fill:color-mix(in srgb,var(--risk) 13%,var(--panel))}
.n.tone-gap .shape{stroke:var(--gap);stroke-width:2;fill:color-mix(in srgb,var(--gap) 13%,var(--panel))}
.n.tone-off .shape{stroke:var(--off);stroke-width:2;stroke-dasharray:2 3;fill:color-mix(in srgb,var(--off) 13%,var(--panel))}
.n .gly-c,.n .gly{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.n.t-fn .gly-c,.n.t-fn .gly{stroke:var(--cyan)}.n.t-cp .gly-c,.n.t-cp .gly{stroke:var(--purple)}.n.t-rs .gly-c,.n.t-rs .gly{stroke:var(--blue)}.n.t-k .gly-c,.n.t-k .gly{stroke:var(--slate)}
.n.tone-risk .gly-c,.n.tone-risk .gly,.n.tone-partial .gly-c,.n.tone-partial .gly{stroke:var(--risk)}
.n.tone-partial .gly{fill:var(--risk)}
.n.tone-gap .gly-c,.n.tone-gap .gly{stroke:var(--gap)}.n.tone-off .gly-c,.n.tone-off .gly{stroke:var(--off)}
.n .l1{font:600 12px var(--font-t);fill:var(--text)}
.n .l2{font:400 10.5px var(--font-t);fill:var(--muted)}
.n .halo{fill:none;stroke:transparent;stroke-width:2}
.n:focus{outline:none}
.n:focus-visible .halo{stroke:var(--cyan);stroke-dasharray:3 3}
.n.sel .halo{stroke:var(--cyan);stroke-width:2.5}
.n.chg .halo{stroke:var(--purple);stroke-width:2}
.n.seed .halo{stroke:var(--off);stroke-width:3}
.n.dim{opacity:.26}.n.exam{opacity:.75}
.n.pulse .halo{stroke:var(--off);animation:pulse .9s ease-out}
@keyframes pulse{0%{stroke-width:10;stroke-opacity:1}100%{stroke-width:2;stroke-opacity:.35}}
.e{fill:none;stroke-width:1.3}
.e-requires{stroke:var(--cyan);stroke-opacity:.5}
.e-depends_on{stroke:var(--purple);stroke-opacity:.6}
.e-implemented_by{stroke:var(--blue);stroke-opacity:.5}
.e-needs{stroke:var(--slate);stroke-opacity:.55;stroke-dasharray:3 4}
.e-bounds{stroke:var(--slate);stroke-opacity:.28;stroke-dasharray:1 5}
.e.soft{stroke-dasharray:6 4}
.e.dim{stroke-opacity:.1}
.e.hot{stroke:var(--off);stroke-opacity:1;stroke-width:2.2;stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:24}}
.mk-requires{fill:var(--cyan)}.mk-depends_on{fill:var(--purple)}.mk-implemented_by{fill:var(--blue)}.mk-needs,.mk-bounds{fill:var(--slate)}.mk-hot{fill:var(--off)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .sep{width:1px;height:16px;background:var(--line2)}
.lg-shape{width:36px;height:12px;overflow:visible}
.lg-shape .shape{stroke-width:7;fill:var(--panel)}
.lg-shape.t-fn .shape{stroke:var(--cyan)}.lg-shape.t-cp .shape{stroke:var(--purple)}.lg-shape.t-rs .shape{stroke:var(--blue)}.lg-shape.t-k .shape{stroke:var(--slate)}
.sw{display:inline-block;width:16px;height:11px;border-radius:3px;border:2px solid var(--line2)}
.sw.risk{border-color:var(--risk);border-style:dashed}.sw.partial{border-color:var(--risk);background:var(--risk-bg)}.sw.gap{border-color:var(--gap);background:var(--gap-bg)}.sw.off{border-color:var(--off);border-style:dotted}.sw.chg{border-color:var(--purple);border-radius:50%;width:12px;height:12px}
.sw.full{background:var(--slate);border-color:var(--slate)}.sw.inc{background:var(--cyan);border-color:var(--cyan)}
.res-list{margin-top:8px}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.res-row.pending{background:var(--risk-bg)}
.res-txt{min-width:0}
.res-txt small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.res-txt .pend{color:var(--risk)}
.batch-bar{display:flex;gap:8px;margin:10px 0}
.insp-type{font-size:12px;color:var(--muted);margin:4px 0 2px}
.insp h3{font-size:17px;margin-bottom:6px}
.why{font-size:13.5px;line-height:1.6}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{display:inline-flex;align-items:center;gap:8px;text-align:end}
.ev-sum{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);margin-bottom:12px}
.ev-title{font:600 14.5px var(--font-d);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.stat b{display:block;font:600 18px var(--font-d)}
.stat span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.stat.gap b{color:var(--gap)}.stat.ok b{color:var(--ok)}.stat.risk b{color:var(--risk)}
.check{font-size:12.5px;margin:0 0 8px}.check.ok{color:var(--ok)}.check.gap{color:var(--gap)}
.audit{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.au-node{all:unset;box-sizing:border-box;display:grid;grid-template-columns:36px 1fr;gap:8px;width:100%;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.55;color:var(--text)}
.au-node:hover{background:var(--panel2)}
.au-node:focus-visible{outline:2px solid var(--cyan)}
.rule{font:600 10.5px/1.6 var(--font-m);color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:0 3px;text-align:center;height:fit-content}
.au-change .rule{color:var(--purple);border-color:var(--purple)}
.au-event .rule{color:var(--off);border-color:var(--off)}
.au-cycle .rule{color:var(--risk);border-color:var(--risk)}
.au-stable{opacity:.72}

/* gaps, reconfiguration */
.gap-list{display:grid;gap:12px;margin:14px 0 16px}
.gap-card{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--gap);border-radius:12px;padding:14px 16px}
.gap-card.sev-risk{border-inline-start-color:var(--risk)}
.gap-card header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.gap-card header h3{margin:0;margin-inline-end:4px}
.reqs{list-style:none;padding:0;margin:0}
.reqs>li{padding:8px 0;border-bottom:1px solid var(--line)}
.req-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rc-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.weights{position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
.wt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:10px 0;font-size:13.5px}
.wt input{grid-column:1/-1;width:100%;padding:0}
.wt output{font-weight:600}
.rc-stats{font-size:13.5px;color:var(--muted)}
.rc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.rc-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rc-card.top{border-color:var(--cyan)}
.rc-card.cmp{box-shadow:inset 0 0 0 2px var(--purple)}
.rc-card header{display:flex;align-items:center;gap:12px}
.rank{font:600 13px var(--font-d);color:var(--muted)}
.score b{font:600 22px var(--font-d);display:block;line-height:1.1}
.score span{font-size:11px;color:var(--muted)}
.sbar{display:flex;flex:1;height:8px;border-radius:4px;overflow:hidden;background:var(--bg2)}
.sbar span{height:100%}
.o-cost{background:var(--cyan)}.o-time{background:var(--blue)}.o-coverage{background:var(--ok)}.o-compatibility{background:var(--purple)}.o-confidence{background:var(--slate)}.o-stability{background:var(--risk)}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chg{margin:0;padding-inline-start:18px;font-size:13px}
.rc-card footer{display:flex;gap:8px;margin-top:auto}
.rej summary{padding:2px 0}
.cmp-t td:first-child{color:var(--muted)}

/* new project */
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px 18px;padding:0;margin:0 0 16px;counter-reset:st}
.steps li{counter-increment:st;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:14px}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font:600 13px var(--font-d)}
.steps li.on{color:var(--text)}
.steps li.on::before{background:var(--cyan);color:var(--on-cyan);border-color:var(--cyan)}
.steps li.done::before{content:"✓";color:var(--ok);border-color:var(--ok)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.form-grid .span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.field small{font-weight:400;color:var(--faint)}
.cell-in{width:100%;min-width:170px;padding:6px 8px;font-size:14px}
.cell-in.num{min-width:80px;width:96px}
.cap-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cap-add{padding:4px 8px;font-size:12.5px}
.qty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.own-list{max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:10px 0}
.own{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.own small{display:block;color:var(--muted);font-size:12px}
.verify{margin:6px 0 4px;color:var(--text)}

/* planner */
.gantt{display:flex;flex-direction:column;gap:7px}
.gr{display:grid;grid-template-columns:minmax(150px,32%) minmax(0,1fr) 128px;gap:12px;align-items:center;font-size:13px}
.gl{min-width:0}
.gl small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd{color:var(--muted);font-size:12px;text-align:end}
.gt{position:relative;height:16px;background:var(--panel2);border-radius:6px}
.gt::after{content:"";position:absolute;top:-4px;bottom:-4px;inset-inline-start:var(--dl,100%);border-inline-start:2px dashed var(--gap);opacity:.75}
.g-scale{background:none;height:18px}
.g-scale::after{display:none}
.g-dead{position:absolute;inset-inline-start:var(--dl,100%);top:0;font-style:normal;font-size:11.5px;color:var(--gap);padding-inline-start:4px;white-space:nowrap;border-inline-start:2px dashed var(--gap)}
.gb{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--blue)}
.gb.proc,.gb.st1{background:var(--slate)}.gb.st2{background:var(--cyan)}.gb.st3{background:var(--blue)}.gb.st4{background:var(--purple)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:0 16px}
.ms{list-style:none;padding:0;margin:0}
.ms li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ms li span{color:var(--muted)}

/* report, lab, docs */
.paper-wrap{background:var(--bg2);border-radius:14px;padding:clamp(10px,2vw,24px);overflow-x:auto}
.scen{display:grid;gap:6px;margin-top:10px}
.scen-i{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2)}
.scen-i summary{font-weight:500;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chart{width:100%;max-width:680px;height:auto;margin-top:12px}
.chart .b-full{fill:var(--slate)}.chart .b-inc{fill:var(--cyan)}
.chart text{font:11px var(--font-t);fill:var(--muted)}
.chart .axis{stroke:var(--line2)}
.legend-s{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.doc{max-width:920px}
.doc h2{margin-top:30px}
.doc p,.doc li{max-width:78ch}
.dq{list-style:none;padding:0;margin:0}
.dq li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}

/* toasts and modal */
#toasts{position:fixed;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-inline-start:4px solid var(--cyan);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:14px;animation:tin .25s ease-out}
.toast.ok{border-inline-start-color:var(--ok)}.toast.warn{border-inline-start-color:var(--risk)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal{position:fixed;inset:0;background:rgba(3,7,20,.58);display:grid;place-items:center;z-index:70;padding:16px}
#modal[hidden]{display:none}
.modal-card{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.modal-card header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-card header h2{margin:0}
.modal-body{padding:16px 20px}
.modal-card footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}

/* landing */
.landing{background:var(--bg)}
.lp-top{display:flex;align-items:center;gap:12px;padding:16px clamp(16px,4vw,52px);background:var(--bg);border-bottom:1px solid var(--line)}
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:clamp(24px,4vw,60px);align-items:center;padding:clamp(32px,6vw,84px) clamp(16px,4vw,52px) clamp(40px,6vw,80px);background:var(--bg);color:var(--text)}
.hero h1{font-size:clamp(34px,4.6vw,58px);line-height:1.06;font-weight:600;margin-bottom:18px;max-width:17ch}
html[lang="ar"] .hero h1{line-height:1.35;max-width:16ch}
.hero-sub{color:var(--muted);font-size:clamp(16px,1.5vw,19px);max-width:52ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 14px}
.hero-note{font-size:13px;color:var(--faint)}
.hero-demo{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.hero-graph{height:clamp(250px,30vw,380px);background-color:var(--panel2);background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:20px 20px;border-radius:12px;overflow:hidden}
.hero-demo figcaption{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 6px 4px}
.hero-demo figcaption p{margin:0;font-size:14px;color:var(--muted);min-height:3.2em}
.lp-sec{padding:clamp(36px,5vw,64px) clamp(16px,4vw,52px);border-top:1px solid var(--line)}
.lp-sec>h2{font-size:clamp(22px,2.4vw,30px);max-width:24ch}
.pipe{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line2)}
.pipe li{padding:16px 14px 6px;border-inline-start:1px solid var(--line)}
.pipe li:first-child{border-inline-start:0;padding-inline-start:0}
.pipe-k{display:block;font:600 30px/1 var(--font-d);color:var(--cyan);margin-bottom:12px}
.pipe h3{font-size:15px}
.pipe p{font-size:13.5px;color:var(--muted)}
.what{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;margin-top:22px}
.what-i{display:block;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);text-decoration:none;transition:border-color .15s}
.what-i:hover{border-color:var(--cyan)}
.what-i.w1{grid-row:span 2;background:var(--panel2)}
.what-i.w1 h3{font-size:22px;margin-top:40px}
.what-i.w4{grid-column:span 2}
.what-i p{color:var(--muted);margin:0;font-size:14px}
.lp-honest{background:var(--panel2)}
.lp-honest p{max-width:80ch;color:var(--muted)}
.lp-foot{padding:24px clamp(16px,4vw,52px) 40px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}

/* responsive */
@media (max-width:1180px){
  .gmain{grid-template-columns:1fr}
  .gside{height:auto;max-height:none;min-height:0}
  .side-body{max-height:none}
  .rc-layout{grid-template-columns:1fr}
  .weights{position:static}
  .two{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px}
  .pipe li:nth-child(5){border-inline-start:0;padding-inline-start:0}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:inline-grid}
  .rail{position:fixed;top:0;inset-inline-start:0;bottom:0;width:276px;height:auto;z-index:40;transform:translateX(-105%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  [dir="rtl"] .rail{transform:translateX(105%)}
  .menu-open .rail{transform:none}
  .menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(3,7,20,.45);z-index:35}
  .store-chip{font-size:0;padding:6px}
  .brand span{display:none}
  .proj-sel select{max-width:42vw}
  .hero{grid-template-columns:1fr}
  .hero h1{max-width:none}
  .what{grid-template-columns:1fr 1fr}
  .what-i.w1{grid-row:auto;grid-column:span 2}
  .what-i.w1 h3{margin-top:0}
  .dash-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topbar{padding:8px 10px;gap:6px}
  .role-sel{display:none}
  .form-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gr{grid-template-columns:1fr;gap:4px}
  .gd{text-align:start}
  .pipe{grid-template-columns:1fr}
  .pipe li{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line)}
  .what{grid-template-columns:1fr}
  .what-i.w1,.what-i.w4{grid-column:auto}
  .gcanvas{height:62vh;min-height:360px}
  .panel{padding:14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media print{
  .topbar,.rail,.scrim,.page-head .row-btns,.report-actions,#toasts,body::before{display:none!important}
  .app{display:block}.main{padding:0}body{background:#fff}.paper-wrap{background:none;padding:0}
}
</style>

doc_conf:['Confidential working document. If you plan to seek patent protection in Oman, consult a patent attorney before sharing this page, because public disclosure can affect novelty.','مستند عمل سري. إن كنت تنوي طلب حماية براءة اختراع في سلطنة عُمان، فاستشر وكيل براءات قبل مشاركة هذه الصفحة، لأن الإفصاح العلني قد يؤثر في شرط الجِدّة.'],
doc_arch_h:['Architecture','البنية'],
doc_arch_p:['The engine is a single JavaScript module with no access to the page. The website calls it through a small interface, and the validation lab runs the same module. Each module below maps to functions in the code.','المحرك وحدة JavaScript واحدة لا تصل إلى الصفحة، يستدعيها الموقع عبر واجهة صغيرة، ويشغّل مختبر التحقق الوحدة نفسها. وتقابل كل وحدة أدناه دوال في الشيفرة.'],
doc_module:['Module','الوحدة'],doc_role:['Role','الدور'],doc_code:['Functions','الدوال'],doc_ds_h:['Data structures','هياكل البيانات'],
doc_ds_p:['The graph stores nodes in a map with outgoing and incoming edge lists. Edges point from a dependent node to what it depends on. Each evaluated node carries a state, a resolution flag, the rule applied, a reason and a watch list of the resources whose status it read.','يخزّن المخطط العقد في خريطة مع قوائم للروابط الصادرة والواردة، وتشير الروابط من العقدة المعتمدة إلى ما تعتمد عليه. وتحمل كل عقدة مقيَّمة حالةً ومؤشر قابلية الحل والقاعدة المطبقة والسبب وقائمة مراقبة بالموارد التي قرأت حالتها.'],
doc_n_f:['Function node','عقدة الوظيفة'],doc_n_f_d:['What the project must do, mandatory or optional. States: FULL, AT_RISK, PARTIAL, BLOCKED, UNCOVERED.','ما يجب أن يؤديه المشروع، إلزامية أو اختيارية. حالاتها: FULL وAT_RISK وPARTIAL وBLOCKED وUNCOVERED.'],
doc_n_c:['Component node','عقدة المكوّن'],doc_n_c_d:['A slot that needs one capability, with a quantity. States: SATISFIED, FAILED, UNASSIGNED, each failure marked resolvable or unresolved.','موضع يحتاج قدرة واحدة مع كمية. حالاته: SATISFIED وFAILED وUNASSIGNED، ويُعلَّم كل تعطل بأنه قابل للحل أو غير محلول.'],
doc_n_r:['Resource node','عقدة المورد'],doc_n_r_d:['A catalog item in the configuration. It provides capabilities, and a capability can add requirements when used in that role. States: OPERATIONAL, UNSUPPORTED, UNAVAILABLE.','عنصر من الكتالوج ضمن التكوين يوفّر قدرات، وقد تضيف القدرة متطلبات عند استخدامها في ذلك الدور. حالاته: OPERATIONAL وUNSUPPORTED وUNAVAILABLE.'],
doc_n_k:['Constraint node','عقدة القيد'],doc_n_k_d:['Budget and deadline, evaluated from the configuration’s cost and duration.','الميزانية والموعد النهائي، وتُقيَّمان من تكلفة التكوين ومدته.'],
doc_e_req:['REQUIRES','REQUIRES'],doc_e_req_d:['Function to component.','من الوظيفة إلى المكوّن.'],doc_e_dep:['DEPENDS_ON, hard or soft','DEPENDS_ON صلبة أو مرنة'],doc_e_dep_d:['Function to function.','من وظيفة إلى وظيفة.'],
doc_e_impl:['IMPLEMENTED_BY','IMPLEMENTED_BY'],doc_e_impl_d:['Component to the resource assigned to it.','من المكوّن إلى المورد المُسنَد إليه.'],
doc_e_needs:['NEEDS, with a tag','NEEDS مع وسم'],doc_e_needs_d:['Resource to each configuration member that supplies a required interface or service.','من المورد إلى كل عضو في التكوين يوفّر واجهة أو خدمة مطلوبة.'],
doc_e_bounds:['BOUNDS','BOUNDS'],doc_e_bounds_d:['Constraint to component, because constraints depend on what components cost and how long they take.','من القيد إلى المكوّن، لأن القيود تعتمد على تكلفة المكونات ومدتها.'],
doc_rules_h:['Dependency and validation rules','قواعد الاعتماد والتحقق'],doc_rule:['Rule','القاعدة'],doc_def:['Definition','التعريف'],
rule_R1_n:['Availability','التوفر'],rule_R1:['A resource whose status is not AVAILABLE is UNAVAILABLE and supplies nothing.','المورد الذي حالته غير AVAILABLE يكون UNAVAILABLE ولا يوفّر شيئًا.'],
rule_R2_n:['Interface support','دعم الواجهات'],rule_R2:['An available resource is OPERATIONAL only if every required tag is supplied by an operational member. Otherwise it is UNSUPPORTED, and resolvable when some available catalog resource supplies each missing tag.','يكون المورد المتاح OPERATIONAL فقط إذا وفّر عضو عامل كل وسم مطلوب، وإلا فهو UNSUPPORTED، ويكون قابلًا للحل إذا وفّر مورد متاح في الكتالوج كل وسم مفقود.'],
rule_R3_n:['Implementation','التنفيذ'],rule_R3:['A component is SATISFIED when its assigned resource provides its capability and is operational.','يكون المكوّن SATISFIED عندما يوفّر المورد المُسنَد قدرته ويكون عاملًا.'],
rule_R4_n:['Substitution and absorption','الاستبدال والاحتواء'],rule_R4:['Before a component failure spreads, alternatives are classified DIRECT, CONDITIONAL or INCOMPATIBLE from statuses alone. A DIRECT or CONDITIONAL alternative, or a restorable supporting resource, makes the failure resolvable, and the gap stops at the directly dependent functions.','قبل انتشار تعطل المكوّن تُصنَّف البدائل إلى DIRECT أو CONDITIONAL أو INCOMPATIBLE اعتمادًا على الحالات فقط. ووجود بديل DIRECT أو CONDITIONAL، أو مورد داعم يمكن استعادته، يجعل التعطل قابلًا للحل فتتوقف الفجوة عند الوظائف المعتمدة مباشرة.'],
rule_R5_n:['Functional coverage','التغطية الوظيفية'],rule_R5:['All components working gives FULL. If the rest are resolvable, AT_RISK. If some work or are resolvable, PARTIAL. If none, UNCOVERED.','إذا عملت جميع المكونات فالحالة FULL، وإذا كانت البقية قابلة للحل فالحالة AT_RISK، وإذا عمل بعضها أو كان قابلًا للحل فالحالة PARTIAL، وإذا لم يعمل أي منها فالحالة UNCOVERED.'],
rule_R6_n:['Dependency inheritance','وراثة الاعتماد'],rule_R6:['A hard dependency on an UNCOVERED or BLOCKED function gives BLOCKED, and on a PARTIAL function gives PARTIAL. A soft dependency on UNCOVERED or BLOCKED gives PARTIAL. AT_RISK never propagates, and the worst result wins.','الاعتماد الصلب على وظيفة UNCOVERED أو BLOCKED يعطي BLOCKED، وعلى وظيفة PARTIAL يعطي PARTIAL. والاعتماد المرن على UNCOVERED أو BLOCKED يعطي PARTIAL. ولا تنتشر حالة AT_RISK أبدًا، والنتيجة الأسوأ هي المعتمدة.'],
rule_R7_n:['Cycles','الدورات'],rule_R7:['Strongly connected nodes are evaluated together from an optimistic start until stable. This gives the greatest fixed point and avoids self-sustaining false gaps.','تُقيَّم العقد المترابطة بقوة معًا بدءًا من افتراض متفائل حتى تستقر، ما يعطي أكبر نقطة ثابتة ويتجنب الفجوات الزائفة ذاتية الاستمرار.'],
rule_R8_n:['Change cut-off','قطع الانتشار'],rule_R8:['When a re-evaluated node keeps its state and resolution, its dependents are not visited.','إذا احتفظت العقدة المعاد تقييمها بحالتها وقابلية حلها، لا تُزار العقد المعتمدة عليها.'],
rule_R9_n:['Watch lists','قوائم المراقبة'],rule_R9:['Every evaluation records the resources whose status it read. A status change re-evaluates those readers even when they are not graph dependents.','يسجّل كل تقييم الموارد التي قرأ حالتها، وأي تغيير في حالتها يعيد تقييم تلك العقد حتى لو لم تكن معتمدة عليها في المخطط.'],
rule_V1_n:['Availability','التوفر'],rule_V1:['Every resource in the configuration must be available.','يجب أن تكون جميع موارد التكوين متاحة.'],
rule_V2_n:['Compatibility','التوافق'],rule_V2:['Every resource must have all of its required interfaces supplied.','يجب توفير جميع الواجهات المطلوبة لكل مورد.'],
rule_V3_n:['Mandatory coverage','التغطية الإلزامية'],rule_V3:['Every mandatory function must be FULL.','يجب أن تكون كل وظيفة إلزامية في الحالة FULL.'],
rule_V4_n:['Budget','الميزانية'],rule_V4:['Total cost, counting quantities and treating owned items as free, must not exceed the budget.','يجب ألا تتجاوز التكلفة الإجمالية الميزانية، مع احتساب الكميات واعتبار الموارد المملوكة بلا تكلفة.'],
rule_V5_n:['Deadline','الموعد النهائي'],rule_V5:['The longest lead time plus total integration effort must not exceed the days available.','يجب ألا يتجاوز مجموع أطول مدة توريد وإجمالي جهد التكامل عدد الأيام المتاحة.'],
rule_V6_n:['Capability integrity','سلامة القدرة'],rule_V6:['Each assigned resource must provide its component’s capability.','يجب أن يوفّر كل مورد مُسنَد قدرة المكوّن المرتبط به.'],
doc_prop_h:['Propagation and incremental update','الانتشار والتحديث التزايدي'],
doc_prop_p1:['Tarjan’s algorithm condenses the graph into strongly connected units ordered dependencies first, and that order is each node’s rank. After a status change, the changed resources and their watchers enter a priority queue keyed by rank, so every unit is evaluated once, after all of its changed inputs.','تختزل خوارزمية Tarjan المخطط إلى وحدات مترابطة بقوة مرتبة بدءًا بالاعتماديات، ويشكّل هذا الترتيب رتبة كل عقدة. وبعد تغيير الحالة تدخل الموارد المتغيرة والعقد المراقبة لها في طابور أولويات مرتب حسب الرتبة، فتُقيَّم كل وحدة مرة واحدة بعد جميع مدخلاتها المتغيرة.'],
doc_prop_p2:['A node whose state is unchanged stops the walk (R8). Alternative checks read only statuses and every read is recorded in a watch list (R9), so the incremental result equals a full recomputation. Every event in this website verifies that equality.','العقدة التي لا تتغير حالتها توقف المسار (R8). ولا تقرأ فحوص البدائل إلا الحالات، وتُسجَّل كل قراءة في قائمة مراقبة (R9)، فتطابق النتيجة التزايدية إعادة الحساب الكاملة، ويتحقق كل حدث في هذا الموقع من هذا التطابق.'],
doc_prop_p3:['The audit trail records every visited node with its previous and new state, the rule that decided it and a structured reason, which the interface turns into sentences in Arabic or English.','يسجّل مسار التدقيق كل عقدة تمت زيارتها مع حالتها السابقة والجديدة والقاعدة التي حسمتها وسببًا منظمًا، وتحوّله الواجهة إلى جمل بالعربية أو الإنجليزية.'],
doc_gen_h:['Configuration generation','توليد التكوينات'],
doc_gen_p:['Adaptive mode frees only the components that are not satisfied, while global mode frees all of them. Each free component gets a domain of available providers ordered by owned items first, then cost, lead time and confidence, plus “none” for components used only by optional functions. Small spaces are enumerated exhaustively and large ones use beam search. Each assignment then goes through a requirement closure that adds supporting resources for missing tags, with up to two alternative closures.','يحرّر الوضع التكيفي المكونات غير العاملة فقط، بينما يحرّر الوضع الشامل جميعها. ويحصل كل مكوّن حر على مجال من الموردين المتاحين مرتبًا بالموارد المملوكة أولًا ثم التكلفة ومدة التوريد والثقة، مع خيار «لا شيء» للمكونات التي لا تستخدمها إلا وظائف اختيارية. وتُستعرض الفضاءات الصغيرة بالكامل ويُستخدم بحث الحزمة للكبيرة، ثم يمر كل إسناد بإغلاق للمتطلبات يضيف موارد داعمة للوسوم المفقودة، مع ما يصل إلى إغلاقين بديلين.'],
doc_rank_h:['Validation and ranking','التحقق والترتيب'],
doc_rank_p:['Every candidate is rebuilt as a graph and checked against V1 to V6, and only valid candidates are ranked. Six objectives are scored between 0 and 1: cost and time as headroom against budget and deadline, weighted coverage, compatibility, mean confidence, and stability as the share of unchanged components. The score is the weighted mean, and the explanation names the strongest objectives, the weakest one and the margin over the next option.','يُعاد بناء كل مرشح كمخطط ويُفحص وفق V1 إلى V6، ولا يُرتَّب إلا الصالح منها. وتُقيَّم ستة أهداف بين 0 و1: التكلفة والوقت كهامش مقابل الميزانية والموعد النهائي، والتغطية الموزونة، والتوافق، ومتوسط الثقة، والاستقرار كنسبة المكونات التي لم تتغير. والنتيجة متوسط موزون، ويذكر الشرح أقوى الأهداف وأضعفها والفارق عن الخيار التالي.'],
doc_exp_h:['Experiments','التجارب'],
doc_exp_p:['The validation lab runs the ten labelled scenarios, compares gap detection with a naive baseline, benchmarks incremental against full recomputation on synthetic graphs and studies single-resource failures in the sample projects. Results are measured when you run them.','يشغّل مختبر التحقق السيناريوهات العشرة الموسومة، ويقارن كشف الفجوات بخط أساس بسيط، ويقيس أداء التحديث التزايدي مقابل إعادة الحساب الكاملة على مخططات اصطناعية، ويدرس تعطل الموارد الفردية في المشاريع النموذجية. وتُقاس النتائج عند تشغيلها.'],
doc_novel_h:['Established algorithms and designed mechanisms','الخوارزميات الراسخة والآليات المصممة'],
doc_novel_p:['The first column lists published techniques the engine reuses. The second lists mechanisms designed for this implementation. Separating them is not a claim that they are new; that needs a professional prior-art search.','يسرد العمود الأول تقنيات منشورة يعيد المحرك استخدامها، ويسرد العمود الثاني آليات صُممت لهذا التنفيذ. والفصل بينهما ليس ادعاءً بأنها جديدة، فذلك يتطلب بحثًا متخصصًا في حالة التقنية السابقة.'],

doc_est2:['Tarjan’s strongly connected components and topological order','المكونات المترابطة بقوة لـ Tarjan والترتيب الطوبولوجي'],doc_new2:['Role-conditioned requirements: a capability adds requirements only when the resource plays that role','المتطلبات المشروطة بالدور: تضيف القدرة متطلبات فقط عندما يؤدي المورد ذلك الدور'],

doc_est4:['Fixed-point iteration','التكرار حتى النقطة الثابتة'],doc_new4:['Optimistic evaluation of strongly connected units over a five-level functional severity order (R7)','التقييم المتفائل للوحدات المترابطة بقوة على سلّم خطورة وظيفي من خمس درجات (R7)'],
doc_est5:['Backtracking, beam search and requirement closure, as in package managers','التراجع وبحث الحزمة وإغلاق المتطلبات، كما في مديري الحزم'],doc_new5:['Adaptive search limited to unsatisfied components, with a stability objective','بحث تكيفي يقتصر على المكونات غير العاملة مع هدف الاستقرار'],
doc_est6:['Weighted-sum multi-criteria ranking','الترتيب متعدد المعايير بالمجموع الموزون'],doc_new6:['Explanations built from rule identifiers and structured reasons in two languages','شروحات مبنية على معرّفات القواعد والأسباب المنظمة بلغتين'],
doc_lim_h:['Known limitations','القيود المعروفة'],
doc_lim1:['Interfaces are matched across the whole configuration, not per physical device or location.','تُطابَق الواجهات على مستوى التكوين كاملًا وليس لكل جهاز أو موقع فعلي.'],
doc_lim2:['Alternative checks look one level ahead. The reconfiguration search gives the definitive answer.','تنظر فحوص البدائل مستوى واحدًا إلى الأمام، ويعطي بحث إعادة التكوين الإجابة الحاسمة.'],
doc_lim3:['Duration is lead time plus sequential effort and ignores parallel work by a team.','المدة هي مدة التوريد زائد الجهد المتتابع، ولا تأخذ العمل المتوازي لفريق في الحسبان.'],
doc_lim4:['Catalog data is synthetic, and costs, lead times and confidence values are illustrative.','بيانات الكتالوج اصطناعية، والتكاليف ومدد التوريد وقيم الثقة توضيحية.'],
doc_lim5:['The offline parser uses keyword rules and needs human review, which the platform requires before building.','يعتمد المحلل دون اتصال على قواعد الكلمات المفتاحية ويحتاج إلى مراجعة بشرية، وتشترطها المنصة قبل البناء.'],
doc_ip_h:['Intellectual property note','ملاحظة حول الملكية الفكرية'],
doc_ip_p:['This prototype makes no claim that the system is patentable, novel worldwide or certain to receive a patent, and a similarity score is never evidence of novelty. Decide on a filing strategy with a qualified professional before disclosing these details publicly.','لا يدّعي هذا النموذج أن النظام قابل للحصول على براءة اختراع أو أنه جديد عالميًا أو أنه سيحصل على براءة حتمًا، ولا تُعدّ أي درجة تشابه دليلًا على الجِدّة. حدّد استراتيجية الإيداع مع مختص مؤهل قبل الإفصاح عن هذه التفاصيل علنًا.'],

  }

  /* ------------------------------------------------------------------
     D. Gap Propagation Engine — incremental, event-driven.
     Mutates analysis A in place. Status changes must already be applied
     to ctx. Each strongly connected unit is evaluated at most once, in
     dependency-first rank order; propagation stops wherever a node's
     state is unchanged (R8). Nodes whose alternative pools read a changed
     resource are re-evaluated through the watch index (R9).
     ------------------------------------------------------------------ */
  function propagate(g, A, changes, ctx) {
    const t0 = now();
    const S = A.states, W = A.watchIndex;
    const heap = new MinHeap(), queued = new Set(), doneScc = new Set(), watchSet = new Set();
    const audit = [], changed = [], examined = [], seeds = [], outside = [];
    let evaluated = 0;
    const push = id => { if (!queued.has(id) && g.nodes.has(id)) { queued.add(id); heap.push(g.rank.get(id), id); } };
    for (const ch of changes) {
      const nid = 'R:' + ch.res;
      audit.push({ kind: 'event', res: ch.res, from: ch.from || null, to: ch.to, inConfig: g.nodes.has(nid) });
      if (g.nodes.has(nid)) { seeds.push(nid); push(nid); } else outside.push(ch.res);
    }
    for (const ch of changes) {
      const ws = W.get(ch.res);
      if (ws) for (const w of Array.from(ws)) if (!queued.has(w)) { watchSet.add(w); push(w); }
    }
    while (heap.size) {
      const id = heap.pop();
      const sid = g.sccOf.get(id);
      if (doneScc.has(sid)) continue;
      doneScc.add(sid);
      const members = g.sccs[sid];
      let results;
      if (members.length === 1 && !g.selfLoop.has(id)) {
        results = [[id, evalNode(g, id, S, ctx)]]; evaluated++;
      } else {
        const rr = evalSCC(g, members, S, ctx);
        results = Array.from(rr.results); evaluated += rr.evals;
        audit.push({ kind: 'cycle', nodes: members.slice(), iterations: rr.iterations, rule: 'R7' });
      }
      for (const [nid, r] of results) {
        const old = S.get(nid);
        removeWatch(W, nid, old); addWatch(W, nid, r);
        S.set(nid, r);
        examined.push(nid);
        if (!old || old.state !== r.state || old.res !== r.res) {
          changed.push(nid);
          audit.push({ kind: 'change', node: nid, from: old ? old.state : null, fromRes: old ? old.res : null, to: r.state, res: r.res, rule: r.rule, reason: r.reason, viaWatch: watchSet.has(nid) });
          for (const e of g.inn.get(nid)) if (members.indexOf(e.from) < 0) push(e.from);
        } else {
          audit.push({ kind: 'stable', node: nid, state: r.state, res: r.res, rule: 'R8', viaWatch: watchSet.has(nid) });
        }
      }
    }
    return { audit, changed, examined, evaluated, seeds, watchers: Array.from(watchSet), outside, ms: now() - t0, total: g.nodes.size };
  }

  function cloneAnalysis(A) {
    const W = new Map();
    for (const [k, s] of A.watchIndex) W.set(k, new Set(s));
    return { states: new Map(A.states), watchIndex: W, evaluated: A.evaluated, ms: A.ms, cycles: A.cycles };
  }

  function compareStates(S1, S2) {
    const diffs = [];
    const keys = new Set([...S1.keys(), ...S2.keys()]);
    for (const k of keys) {
      const a = S1.get(k), b = S2.get(k);
      if (!a || !b || a.state !== b.state || a.res !== b.res) diffs.push({ node: k, a: a ? a.state + '/' + a.res : null, b: b ? b.state + '/' + b.res : null });
    }
    return diffs;
  }

  /* ------------------------------------------------------------------
     Gap report (for the Gap Analysis page and the report)
     ------------------------------------------------------------------ */
  function downstream(g, nid) {
    const seen = new Set([nid]), out = [], q = [nid];
    while (q.length) {
      const x = q.shift();
      for (const e of g.inn.get(x) || []) {
        if (seen.has(e.from)) continue;
        seen.add(e.from);
        if (g.nodes.get(e.from).type === 'FUNCTION') out.push(e.from.slice(2));
        if (g.nodes.get(e.from).type !== 'CONSTRAINT') q.push(e.from);
      }
    }
    return out;
  }

  function gapReport(project, g, A) {
    const S = A.states;
    const fns = project.functions.map(f => {
      const s = S.get('F:' + f.id) || {};
      return { id: f.id, mandatory: !!f.mandatory, state: s.state, coverage: s.coverage, rule: s.rule, reason: s.reason, downstream: downstream(g, 'F:' + f.id) };
    });
    const comps = project.components.map(c => {
      const s = S.get('C:' + c.id) || {};
      return { id: c.id, capability: c.capability, assigned: (g.config.assign || {})[c.id] || null, state: s.state, res: s.res, rule: s.rule, reason: s.reason, alts: s.alts || [] };
    });
    const resources = g.memberIds.map(rid => {
      const s = S.get('R:' + rid) || {};
      return { id: rid, state: s.state, res: s.res, rule: s.rule, reason: s.reason };
    });
    const count = st => fns.filter(f => f.state === st).length;
    return {
      fns, comps, resources, cycles: g.cycles.map(c => c.slice()),
      summary: { full: count('FULL'), atRisk: count('AT_RISK'), partial: count('PARTIAL'), blocked: count('BLOCKED'), uncovered: count('UNCOVERED'), unresolved: count('PARTIAL') + count('BLOCKED') + count('UNCOVERED') }
    };
  }

  /* ------------------------------------------------------------------
     F. Configuration Validator
     ------------------------------------------------------------------ */
  function diffAssign(project, a, b) {
    const out = [];
    const aa = (a && a.assign) || {}, bb = (b && b.assign) || {};
    for (const c of project.components) {
      const x = aa[c.id] || null, y = bb[c.id] || null;
      if (x !== y) out.push({ comp: c.id, from: x, to: y });
    }
    return out;
  }
  function diffAux(a, b) {
    const sa = new Set(((a && a.aux) || []).map(x => x.res)), sb = new Set(((b && b.aux) || []).map(x => x.res));
    return { added: Array.from(sb).filter(x => !sa.has(x)), removed: Array.from(sa).filter(x => !sb.has(x)) };
  }

  function configMetrics(project, config, ctx, g, S, baseline) {
    const m = g.metrics;
    let wsum = 0, csum = 0;
    for (const f of project.functions) {
      const w = f.mandatory ? 2 : 1; wsum += w;
      const s = S.get('F:' + f.id);
      if (!s) continue;
      const cv = s.state === 'FULL' ? 1 : s.state === 'AT_RISK' ? 0.75 : s.state === 'PARTIAL' ? (s.coverage || 0) * 0.5 : 0;
      csum += w * cv;
    }
    let reqTotal = 0, unmet = 0, adapters = 0, confSum = 0, confN = 0;
    for (const rid of g.memberIds) {
      const n = g.nodes.get('R:' + rid), r = n.ref;
      if (!r) continue;
      reqTotal += n.reqs.length;
      const s = S.get('R:' + rid);
      if (s && s.state === 'UNSUPPORTED') unmet += s.reason.p.lost.length + s.reason.p.missing.length;
      if (r.adapter) adapters++;
      confSum += r.confidence || 0; confN++;
    }
    const changes = baseline ? diffAssign(project, baseline, config) : [];
    const ownedTotal = ctx.owned.size;
    let ownedUsed = 0;
    for (const rid of g.memberIds) if (ctx.owned.has(rid)) ownedUsed++;
    return {
      cost: m.cost, days: m.days, maxLead: m.maxLead, effort: m.effort,
      coverage: wsum ? csum / wsum : 1,
      compatibility: clamp01(1 - 0.12 * adapters - (reqTotal ? 0.6 * unmet / reqTotal : 0)),
      confidence: confN ? confSum / confN : 0,
      stability: baseline && project.components.length ? 1 - changes.length / project.components.length : 1,
      changes, adapters, ownedUsed, ownedTotal, utilization: ownedTotal ? ownedUsed / ownedTotal : null,
      resources: g.memberIds.length, lines: m.lines
    };
  }

  function validate(project, config, ctx, baseline) {
    const vctx = ctx.skipAlternatives ? ctx : ctx.derive({ skipAlternatives: true });
    const g = buildGraph(project, config, vctx);
    const A = analyze(g, vctx);
    const S = A.states, violations = [];
    for (const rid of g.memberIds) {
      const r = vctx.byId.get(rid);
      if (!r) { violations.push({ code: 'V1', p: { res: rid, status: 'UNKNOWN' } }); continue; }
      if (!vctx.available(rid)) violations.push({ code: 'V1', p: { res: rid, status: vctx.statusOf(rid) } });
      const s = S.get('R:' + rid);
      if (s && s.state === 'UNSUPPORTED') violations.push({ code: 'V2', p: { res: rid, tags: s.reason.p.lost.concat(s.reason.p.missing) } });
    }
    for (const c of project.components) {
      const rid = (config.assign || {})[c.id];
      const r = rid && vctx.byId.get(rid);
      if (r && !provides(r, c.capability)) violations.push({ code: 'V6', p: { comp: c.id, res: rid, cap: c.capability } });
    }
    for (const f of project.functions) if (f.mandatory) {
      const s = S.get('F:' + f.id);
      if (!s || s.state !== 'FULL') violations.push({ code: 'V3', p: { fn: f.id, state: s ? s.state : 'UNKNOWN' } });
    }
    const m = g.metrics;
    if (m.cost > (+project.budget || 0) + 1e-9) violations.push({ code: 'V4', p: { cost: m.cost, budget: +project.budget || 0 } });
    if (m.days > (+project.deadlineDays || 0)) violations.push({ code: 'V5', p: { days: m.days, deadline: +project.deadlineDays || 0 } });
    const fnStates = {};
    for (const f of project.functions) { const s = S.get('F:' + f.id); fnStates[f.id] = s ? s.state : 'UNKNOWN'; }
    return { valid: violations.length === 0, violations, metrics: configMetrics(project, config, vctx, g, S, baseline), fnStates };
  }

  /* ------------------------------------------------------------------
     E. Adaptive Reconfiguration Engine
     ------------------------------------------------------------------ */
  function closeRequirements(project, assign, ctx, opts) {
    opts = opts || {};
    const LIMIT = opts.limit || 2, MAXDEPTH = opts.maxDepth || 6, BRANCH = opts.branch || 2;
    const base = memberRoles(project, { assign, aux: [] });
    const roles = new Map();
    for (const [rid, info] of base) roles.set(rid, new Set(info.roles));
    const closures = [];
    let failure = null;
    const order = resourceOrder(ctx, 1);
    const missing = rolesMap => {
      const ids = Array.from(rolesMap.keys()), need = [];
      for (const [rid, caps] of rolesMap) {
        const r = ctx.byId.get(rid);
        if (!r) continue;
        for (const t of requirementsOf(r, caps)) {
          let ok = false;
          for (const m of ids) if (m !== rid && ctx.available(m) && provides(ctx.byId.get(m), t)) { ok = true; break; }
          if (!ok && need.indexOf(t) < 0) need.push(t);
        }
      }
      return need.sort();
    };
    (function rec(rolesMap, aux, depth) {
      if (closures.length >= LIMIT) return;
      const miss = missing(rolesMap);
      if (!miss.length) { closures.push(aux.slice()); return; }
      const t = miss[0];
      if (depth >= MAXDEPTH) { if (!failure) failure = { aux: aux.slice(), tag: t, reason: 'depth' }; return; }
      const provs = ctx.providers(t).filter(r => ctx.available(r.id) && !rolesMap.has(r.id)).sort(order).slice(0, BRANCH);
      if (!provs.length) { if (!failure) failure = { aux: aux.slice(), tag: t, reason: 'no_provider' }; return; }
      for (const p of provs) {
        const next = new Map(rolesMap); next.set(p.id, new Set([t]));
        rec(next, aux.concat([{ res: p.id, tag: t }]), depth + 1);
        if (closures.length >= LIMIT) return;
      }
    })(roles, [], 0);
    return { closures, failure };
  }

  function configSignature(project, cfg) {
    const a = project.components.map(c => c.id + '=' + ((cfg.assign || {})[c.id] || '-')).join('|');
    const x = ((cfg.aux || []).map(q => q.res)).sort().join(',');
    return a + '#' + x;
  }

  function partialCost(project, assign, ctx, baseAssign, compById) {
    const seen = new Map();
    let nulls = 0, changes = 0;
    for (const cid of Object.keys(assign)) {
      const rid = assign[cid], c = compById.get(cid);
      if (hasOwn(baseAssign, cid) && (baseAssign[cid] || null) !== (rid || null)) changes++;
      if (!rid) { nulls++; continue; }
      seen.set(rid, Math.max(seen.get(rid) || 0, (c && c.qty) || 1));
    }
    let cost = 0, lead = 0, conf = 0, infeasible = 0, open = 0;
    for (const [rid, qty] of seen) {
      const r = ctx.byId.get(rid);
      cost += ctx.unitCost(rid) * qty; lead = Math.max(lead, ctx.leadDays(rid)); conf += 1 - (r.confidence || 0);
      for (const t of r.requires || []) {
        let inSet = false;
        for (const m of seen.keys()) if (m !== rid && provides(ctx.byId.get(m), t)) { inSet = true; break; }
        if (!inSet) { open++; if (!ctx.providers(t).some(p => ctx.available(p.id))) infeasible++; }
      }
    }
    return cost / Math.max(1, +project.budget || 1) + lead / Math.max(1, +project.deadlineDays || 1) + 0.15 * conf + 0.5 * nulls + 0.08 * changes + 0.03 * open + 10 * infeasible;
  }

  function beamSearch(project, order, domains, fixed, base, ctx, width) {
    const compById = new Map(project.components.map(c => [c.id, c]));
    const baseAssign = (base && base.assign) || {};
    let beam = [{ a: {}, h: 0 }];
    for (const cid of order) {
      const next = [];
      for (const b of beam) for (const rid of domains[cid]) {
        const a = Object.assign({}, b.a); a[cid] = rid;
        next.push({ a, h: partialCost(project, Object.assign({}, fixed, a), ctx, baseAssign, compById) });
      }
      next.sort((x, y) => x.h - y.h);
      beam = next.slice(0, width);
    }
    return beam.map(b => b.a);
  }

  function reconfigure(project, base, ctx, opts) {
    opts = opts || {};
    const t0 = now();
    const mode = opts.mode || 'adaptive';
    const vctx = ctx.derive({ skipAlternatives: true });
    const comps = project.components;
    const compById = new Map(comps.map(c => [c.id, c]));
    const mandatoryComps = new Set();
    for (const f of project.functions) if (f.mandatory) for (const cid of (f.requires || [])) mandatoryComps.add(cid);
    const baseAssign = (base && base.assign) || {};
    let free;
    if (mode === 'global') free = comps.map(c => c.id);
    else {
      const A = opts.analysis || analyze(buildGraph(project, base, ctx), ctx);
      free = comps.filter(c => { const s = A.states.get('C:' + c.id); return !s || s.state !== 'SATISFIED'; }).map(c => c.id);
    }
    const fixed = {};
    for (const c of comps) if (free.indexOf(c.id) < 0) fixed[c.id] = baseAssign[c.id] || null;
    const domains = {}, unresolved = [];
    for (const cid of free) {
      const c = compById.get(cid);
      let dom = ctx.providers(c.capability).filter(r => ctx.available(r.id)).sort(resourceOrder(ctx, c.qty)).map(r => r.id);
      const b = baseAssign[cid];
      if (b && dom.indexOf(b) > 0) { dom.splice(dom.indexOf(b), 1); dom.unshift(b); }
      if (opts.maxDomain && dom.length > opts.maxDomain) dom = dom.slice(0, opts.maxDomain);
      if (!dom.length) unresolved.push({ comp: cid, cap: c.capability, mandatory: mandatoryComps.has(cid) });
      if (!mandatoryComps.has(cid) || !dom.length) dom.push(null);
      domains[cid] = dom;
    }
    const order = free.slice().sort((a, b) => domains[a].length - domains[b].length);
    let product = 1;
    for (const cid of order) { product *= domains[cid].length; if (product > 1e12) break; }
    const exLimit = opts.exhaustiveLimit || 1500;
    let assignments = [], strategy;
    if (!free.length) { strategy = 'none'; assignments = [{}]; }
    else if (product <= exLimit) {
      strategy = 'exhaustive';
      (function rec(i, acc) {
        if (i === order.length) { assignments.push(Object.assign({}, acc)); return; }
        const cid = order[i];
        for (const rid of domains[cid]) { acc[cid] = rid; rec(i + 1, acc); }
        delete acc[cid];
      })(0, {});
    } else {
      strategy = 'beam';
      assignments = beamSearch(project, order, domains, fixed, base, vctx, opts.beamWidth || 80);
    }
    const seen = new Set(), valid = [], rejected = [], stats = {};
    let validations = 0;
    for (const a of assignments) {
      const assign = Object.assign({}, fixed, a);
      const cl = closeRequirements(project, assign, vctx, { limit: opts.closures || 2 });
      const list = cl.closures.length ? cl.closures : [cl.failure ? cl.failure.aux : []];
      for (const aux of list) {
        const cfg = { assign, aux };
        const sig = configSignature(project, cfg);
        if (seen.has(sig)) continue;
        seen.add(sig);
        const v = validate(project, cfg, vctx, base); validations++;
        const item = { config: cfg, valid: v.valid, violations: v.violations, metrics: v.metrics, fnStates: v.fnStates, signature: sig };
        if (v.valid) valid.push(item);
        else {
          rejected.push(item);
          for (const code of uniq(v.violations.map(x => x.code))) stats[code] = (stats[code] || 0) + 1;
        }
      }
    }
    rankConfigurations(valid, opts.weights || DEFAULT_WEIGHTS, project);
    rejected.sort((x, y) => x.violations.length - y.violations.length || x.metrics.cost - y.metrics.cost);
    return {
      mode, strategy, free, domains, unresolved,
      valid: valid.slice(0, opts.keep || 300), validCount: valid.length,
      rejected: rejected.slice(0, opts.maxRejected || 6), rejectedCount: rejected.length, rejectionStats: stats,
      explored: assignments.length, product, validations, ms: now() - t0
    };
  }

  /* ------------------------------------------------------------------
     G. Configuration Ranking Engine (weighted objectives, explainable)
     ------------------------------------------------------------------ */
  function objectiveScores(m, project) {
    return {
      cost: clamp01(1 - m.cost / Math.max(+project.budget || 0, 1e-9)),
      time: clamp01(1 - m.days / Math.max(+project.deadlineDays || 0, 1e-9)),
      coverage: clamp01(m.coverage), compatibility: clamp01(m.compatibility),
      confidence: clamp01(m.confidence), stability: clamp01(m.stability)
    };
  }

  function rankConfigurations(items, weights, project) {
    weights = weights || DEFAULT_WEIGHTS;
    const sumW = OBJECTIVES.reduce((s, k) => s + Math.max(0, +weights[k] || 0), 0) || 1;
    for (const it of items) {
      const s = objectiveScores(it.metrics, project);
      let score = 0;
      const breakdown = {};
      for (const k of OBJECTIVES) {
        const w = Math.max(0, +weights[k] || 0);
        const c = w * s[k] / sumW;
        breakdown[k] = { s: s[k], w, c };
        score += c;
      }
      it.score = score; it.breakdown = breakdown;
    }
    items.sort((a, b) => b.score - a.score || a.metrics.cost - b.metrics.cost || (a.signature < b.signature ? -1 : 1));
    items.forEach((it, i) => { it.rank = i + 1; });
    return items;
  }

  function explainRank(items, i) {
    const it = items[i];
    if (!it || !it.breakdown) return null;
    const ks = OBJECTIVES.filter(k => it.breakdown[k].w > 0);
    const strengths = ks.slice().sort((a, b) => it.breakdown[b].c - it.breakdown[a].c).slice(0, 2);
    const weakest = ks.slice().sort((a, b) => it.breakdown[a].s - it.breakdown[b].s)[0] || null;
    const next = items[i + 1];
    let vsNext = null;
    if (next && next.breakdown) {
      vsNext = ks.map(k => ({ k, d: it.breakdown[k].c - next.breakdown[k].c })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 2);
    }
    return { strengths, weakest, vsNext, margin: next ? it.score - next.score : null };
  }

  /* ------------------------------------------------------------------
     A. Project Parser — offline, rule-based extraction (human-verified)
     ------------------------------------------------------------------ */
  function normalizeText(s) {
    return String(s || '').toLowerCase()
      .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
      .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
      .replace(/[\u0625\u0623\u0622\u0671]/g, '\u0627')
      .replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647').replace(/\u0640/g, '')
      .replace(/[\u064B-\u0652]/g, '')
      .replace(/\u2082/g, '2')
      .replace(/[\u2010-\u2015]/g, '-');
  }
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function matchTerms(norm, terms) {
    const hits = [];
    for (const term of terms) {
      const t = normalizeText(term);
      if (/^[\x00-\x7F]+$/.test(t)) {
        if (new RegExp('(^|[^a-z0-9])' + escRe(t) + '([^a-z0-9]|$)').test(norm)) hits.push(term);
      } else if (norm.indexOf(t) >= 0) hits.push(term);
    }
    return hits;
  }

  function parseProjectText(text, lex) {
    const norm = normalizeText(text);
    const evidence = [], warnings = [];
    const caps = [];
    for (const cap of Object.keys(lex.sensing)) {
      const hits = matchTerms(norm, lex.sensing[cap]);
      if (hits.length) { caps.push(cap); evidence.push({ kind: 'capability', id: cap, terms: hits }); }
    }
    const feat = {};
    for (const k of Object.keys(lex.features)) {
      const hits = matchTerms(norm, lex.features[k]);
      if (hits.length) { feat[k] = true; evidence.push({ kind: 'feature', id: k, terms: hits }); }
    }
    let domain = 'other', best = 0;
    for (const d of Object.keys(lex.domains)) {
      const n = matchTerms(norm, lex.domains[d]).length;
      if (n > best) { best = n; domain = d; }
    }
    const T = lex.templates, fns = [];
    let k = 0;
    const add = (name, capsList, mandatory, dependsOn) => {
      const key = 'f' + (++k);
      fns.push({ key, name: { en: name.en, ar: name.ar }, mandatory, capabilities: capsList, dependsOn: dependsOn || [] });
      return key;
    };
    const sensingKeys = [];
    const hasTH = caps.indexOf('temp_sensing') >= 0 && caps.indexOf('humidity_sensing') >= 0;
    for (const cap of caps) {
      if (hasTH && cap === 'humidity_sensing') continue;
      if (hasTH && cap === 'temp_sensing') { sensingKeys.push(add(T.tempHum, ['temp_sensing', 'humidity_sensing'], true)); continue; }
      sensingKeys.push(add(T.sense[cap], [cap], cap !== 'image_capture'));
    }
    const remote = feat.remote || feat.storage || feat.dashboard || feat.alerts || feat.anomaly;
    let acq = null, tx = null, store = null;
    if (sensingKeys.length || feat.actuation || feat.display) {
      acq = add(T.acquire, ['mcu'], true, sensingKeys.map(x => ({ key: x, type: 'soft' })));
    }
    if (remote) tx = add(T.transmit, feat.broker ? ['wireless_uplink', 'message_broker'] : ['wireless_uplink'], true, acq ? [{ key: acq, type: 'hard' }] : []);
    if (feat.storage || feat.dashboard || feat.anomaly) store = add(T.store, ['timeseries_db', 'server_host'], true, tx ? [{ key: tx, type: 'hard' }] : []);
    if (feat.dashboard) add(T.dashboard, ['dashboard_ui'], true, store ? [{ key: store, type: 'hard' }] : []);
    if (feat.alerts) add(T.alerts, ['alert_notifications'], true, tx ? [{ key: tx, type: 'hard' }] : []);

  function precisionRecall(results) {
    const acc = () => ({ tp: 0, fp: 0, fn: 0 });
    const m = { fgarGap: acc(), naiveGap: acc(), fgarImpact: acc(), naiveImpact: acc() };
    const add = (bucket, pred, truth) => {
      for (const x of pred) if (truth.indexOf(x) >= 0) bucket.tp++; else bucket.fp++;
      for (const x of truth) if (pred.indexOf(x) < 0) bucket.fn++;

      const gapTruth = b.expected.unresolved, impactTruth = b.expected.unresolved.concat(b.expected.atRisk);
      add(m.fgarGap, b.fgar.unresolved, gapTruth);
      add(m.naiveGap, b.naive, gapTruth);
      add(m.fgarImpact, b.fgar.unresolved.concat(b.fgar.atRisk), impactTruth);
      add(m.naiveImpact, b.naive, impactTruth);
    }
    const fin = x => ({ tp: x.tp, fp: x.fp, fn: x.fn, precision: x.tp + x.fp ? x.tp / (x.tp + x.fp) : 1, recall: x.tp + x.fn ? x.tp / (x.tp + x.fn) : 1 });
    return { fgarGap: fin(m.fgarGap), naiveGap: fin(m.naiveGap), fgarImpact: fin(m.fgarImpact), naiveImpact: fin(m.naiveImpact) };
  }

  function runScenarios(FGAR) {

    });

  }

  /* ---------------- Synthetic scale benchmark ---------------- */
  function syntheticInstance(FGAR, nF, seed, cycles) {
    const rnd = mulberry32(seed);
    const pick = arr => arr[Math.floor(rnd() * arr.length)];
    const IF = ['ia', 'ib', 'ic', 'id'];
    const catalog = [];
    const nHosts = Math.max(3, Math.round(nF / 10));
    for (let i = 0; i < nHosts; i++) {
      const prov = { platform: [] };
      IF.forEach(t => { if (rnd() < 0.55) prov[t] = []; });
      prov[IF[i % IF.length]] = [];
      catalog.push({ id: 'H' + i, name: 'Host ' + i, category: 'mcu', provides: prov, requires: [], cost: 2 + rnd() * 8, leadDays: 1 + Math.floor(rnd() * 8), effortDays: 1, confidence: 0.7 + rnd() * 0.3, status: 'AVAILABLE' });
    }
    const nCaps = Math.max(4, Math.round(nF * 1.2));
    for (let c = 0; c < nCaps; c++) {
      const k = 1 + Math.floor(rnd() * 3);
      for (let j = 0; j < k; j++) {
        catalog.push({ id: 'P' + c + '_' + j, name: 'Part ' + c + '.' + j, category: 'sensor', provides: { ['cap' + c]: [] }, requires: rnd() < 0.75 ? [pick(IF)] : [], cost: 1 + rnd() * 6, leadDays: 1 + Math.floor(rnd() * 12), effortDays: 0.5, confidence: 0.6 + rnd() * 0.4, status: 'AVAILABLE' });
      }
    }
    const components = [{ id: 'cp', capability: 'platform', qty: 1 }];
    for (let c = 0; c < nCaps; c++) components.push({ id: 'c' + c, capability: 'cap' + c, qty: 1 });
    const functions = [];
    for (let i = 0; i < nF; i++) {
      const req = ['c' + Math.floor(rnd() * nCaps)];
      if (rnd() < 0.5) { const x = 'c' + Math.floor(rnd() * nCaps); if (req.indexOf(x) < 0) req.push(x); }
      if (rnd() < 0.15) req.push('cp');
      const deps = [];
      if (i > 0) {
        const nd = Math.floor(rnd() * 3);
        for (let d = 0; d < nd; d++) { const f = 'f' + Math.floor(rnd() * i); if (!deps.some(x => x.fn === f)) deps.push({ fn: f, type: rnd() < 0.7 ? 'hard' : 'soft' }); }
      }
      functions.push({ id: 'f' + i, name: { en: 'F' + i, ar: 'F' + i }, mandatory: rnd() < 0.8, requires: req, dependsOn: deps });
    }
    if (cycles && nF > 3) {
      const nb = Math.max(1, Math.round(nF / 25));
      for (let b = 0; b < nb; b++) {
        const lo = Math.floor(rnd() * (nF - 2));
        const hi = Math.min(nF - 1, lo + 1 + Math.floor(rnd() * 4));
        if (!functions[lo].dependsOn.some(d => d.fn === 'f' + hi)) functions[lo].dependsOn.push({ fn: 'f' + hi, type: 'soft' });
      }
    }
    const assign = { cp: 'H0' };
    for (let c = 0; c < nCaps; c++) assign['c' + c] = 'P' + c + '_0';
    const project = { id: 'bench', budget: 1e9, deadlineDays: 1e9, components, functions, owned: [] };
    const ctx = FGAR.createContext(catalog);
    const cl = FGAR.closeRequirements(project, assign, ctx, { limit: 1, maxDepth: 8 });

  }

  function benchmark(FGAR, opts) {

      for (let t = 0; t < trials; t++) {
        const rid = members[Math.floor(rnd() * members.length)];
        const change = [{ res: rid, from: 'AVAILABLE', to: 'UNAVAILABLE' }];
        const clones = [];
        for (let r = 0; r < reps; r++) clones.push(FGAR.cloneAnalysis(base));
        ctx.setStatus(rid, 'UNAVAILABLE');
        let res = null, full = null;
        const t0 = now();
        for (let r = 0; r < reps; r++) res = FGAR.propagate(g, clones[r], change, ctx);
        const t1 = now();
        for (let r = 0; r < reps; r++) full = FGAR.analyze(g, ctx);

  }

          if (top.metrics.utilization !== null) ownedUse.push(top.metrics.utilization);
        }
      }

  }

const Store = {

  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') { setStorage('local'); return; }
    try {
      const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { setStorage('local'); return; }

      setStorage('loading');
      let done = false;
      const timer = setTimeout(() => { if (!done) setStorage('slow'); }, 10000);
      this.col().get().then(snap => {
        done = true; clearTimeout(timer);
        mergeDocs(snap.docs.map(d => ({ id: d.id, data: d.data() })));
        this.mode = 'cloud'; setStorage('cloud'); softRefresh();
      }).catch(() => { done = true; clearTimeout(timer); setStorage('local'); });
    } catch (e) { setStorage('local'); }
  },
  save(key, obj) {

    clearTimeout(this.timers[key]);

  },
  async flush(key) {

    const obj = this.q[key]; delete this.q[key];
    this.busy[key] = true;
    try {
      if (obj === null) await this.col().doc(key).delete();
      else await this.col().doc(key).set(obj);
    } catch (e) {
      const code = e && e.code;

      if (!this.warned) { this.warned = true; toast(code === 'quota_exceeded' ? t('save_quota') : t('save_failed'), 'warn'); }

};

/* ---------------- FGAR event flow ---------------- */
function runEvent(p, changes) {
  const r = rt(p);
  const ch = changes.map(c => ({ res: c.res, from: r.ctx.statusOf(c.res), to: c.to })).filter(c => c.from !== c.to);
  if (!ch.length) return null;
  const before = { analysis: E.cloneAnalysis(r.analysis), overrides: clone(p.current.overrides), config: clone(p.current.config) };
  for (const c of ch) { r.ctx.setStatus(c.res, c.to); p.current.overrides[c.res] = c.to; }
  const result = E.propagate(r.graph, r.analysis, ch, r.ctx);
  const full = E.analyze(r.graph, r.ctx);
  const diffs = E.compareStates(r.analysis.states, full.states);
  r.status = null;

  const hist = { ts: Date.now(), kind: 'event', changes: ch, evaluated: result.evaluated, total: result.total, changed: result.changed.length, unresolved: gaps.unresolved, atRisk: gaps.atRisk, ms: Math.round(result.ms * 1000) / 1000, identical: diffs.length === 0, valid: null };

  const aux = E.diffAux(before, item.config);
  p.history.push({ ts: Date.now(), kind: 'apply', changes, auxAdded: aux.added, auxRemoved: aux.removed, cost: item.metrics.cost, days: item.metrics.days, score: Math.round((item.score || 0) * 1000) / 1000, before, after: clone(item.config) });

}

/* ---------------- reason sentences ---------------- */
function compSuffix(q, res) {

    if (q.conditional && q.conditional.length) return t('cs_conditional', { list: listJoin(q.conditional.slice(0, 4).map(resLabel)) });

  }

}
function reasonText(p, r) {

  const fn = q.fn ? B(esc(fnLabel(p, q.fn))) : '', comp = q.comp ? B(esc(compLabel(p, q.comp))) : '', res = q.res ? B(resLabel(q.res)) : '';
  const comps = arr => listJoin((arr || []).map(c => B(esc(compLabel(p, c)))));
  const ups = arr => listJoin((arr || []).map(u => B(esc(fnLabel(p, u.fn)))));
  switch (code) {
    case 'res_unknown': return t('rs_unknown', { res });
    case 'res_unavailable': return t('rs_unavailable', { res });
    case 'res_ok': return t('rs_ok', { res });
    case 'res_unsupported': return t('rs_unsupported', { res, tags: listJoin(q.lost.concat(q.missing).map(x => B(esc(tagLabel(x))))) }) + (q.via && q.via.length ? ' ' + t('rs_via', { via: listJoin(q.via.map(resLabel)) }) : '') + ' ' + t(r.res === 'RESOLVABLE' ? 'rs_fixable' : 'rs_unfixable');
    case 'comp_ok': return t('cs_ok', { comp, res });
    case 'comp_unassigned': return t('cs_unassigned', { comp }) + ' ' + compSuffix(q, r.res);
    case 'comp_failed_unavailable': return t('cs_unavailable', { comp, res }) + ' ' + compSuffix(q, r.res);
    case 'comp_failed_unsupported': return t('cs_unsupported', { comp, res }) + ' ' + compSuffix(q, r.res);
    case 'comp_mismatch': return t('cs_mismatch', { res, cap: B(esc(tagLabel(q.cap))) }) + ' ' + compSuffix(q, r.res);
    case 'fn_full': return t('fs_full', { fn, sat: q.sat, total: q.total });
    case 'fn_at_risk': return t('fs_at_risk', { fn, comps: comps(q.atRisk) });
    case 'fn_partial': return t('fs_partial', { fn, comps: comps(q.missing) });
    case 'fn_uncovered': return t('fs_uncovered', { fn });
    case 'fn_blocked': return t('fs_blocked', { fn, up: ups(q.upstream) });
    case 'fn_degraded': return t('fs_degraded', { fn, up: ups(q.upstream) });
    case 'k_budget_ok': case 'k_budget_violated': return t(code, { cost: omr(q.cost), limit: omr(q.limit) });
    case 'k_deadline_ok': case 'k_deadline_violated': return t(code, { days: num(q.days, 0), limit: num(q.limit, 0) });

  }
}
